<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create account</title>
</head>
<body>
    <div class="logo"> Pixel</div>
    <h1> create account</h1>
    <p class="subtittle"> please fill in the form below to create an accont</p>
    <form action="">
        <div class="input-group">
            <label for="fullname"> fullname</label>
            <input type="text" id="fullname" name="fullname"
            placeholder="enter your fullname" required>

        </div>
        <div class="input-group">
             <label for=" email"> email address</label>
            <input type="email" id="email" name="email"
            placeholder="enter your email address" required>

        </div>
        <div class="input-group">
            <label for="password">passsword</label>
            <input type="password" id="passsword" name="passsword" 
            placeholder="enter your passsword" required>

        </div>
        <div class="input-group">
            <label for="   confirm password"> confirm passsword</label>
            <input type="password" id=" confirm passsword" name=" confirm passsword" 
            placeholder="confirm your passsword" required>

        </div>
        <div  class="terms">
          <input type="checkbox" name="terms" required>
          <label for="terms"> i agree to the <a href=" #"> terms and conditons apply </a></label>

        </div>
        <button type="submit"> create account</button>
    </form>
    <p> already have an account?
        <a href="#">login here</a>
    </p>
    
</body>
</html>
