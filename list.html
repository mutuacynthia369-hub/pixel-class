<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
    <p> Lists are used to group related items together.
        ordered lists and unordered lists </p>  
        <h2>ordered list</h2>  
        <h1> list of countries</h1> 
        <ol>
            <li>Kenya</li>
            <li>Uganda</li>
            <li>Tanzania</li>
            <li>Rwanda</li>
            <li>Burundi</li>

        </ol>
        <h2>unordered list</h2>
        <h1>list of fruits</h1>
        <ul>
            <li>Banana</li>
            <li>Apple</li>
            <li>Mango</li>
            <li>Pineapple</li>
            <li>orange</li>
        </ul>
</body>
</html>
